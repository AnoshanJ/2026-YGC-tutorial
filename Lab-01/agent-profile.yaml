# Agent profile — the agent's identity and runtime configuration.
#
# This file is the complete declarative description of the agent. The
# Python harness in agent/core.py is a loader; everything below is what
# the agent actually has.
#
# To apply edits: type `exit` in the REPL, then run `python run.py`
# again. The agent is built once per launch — there is no hot-reload.

agent:
  id: cs-agent-v1
  name: Customer Support Agent
  model: gpt-5
  language: English

  # The system prompt — everything the agent reads at the start of every
  # conversation. Restart the REPL to apply edits. Placeholders {name},
  # {agent_id}, {refund_cap_usd}, {language} are filled from the fields
  # above. If `memory.episodic: true`, an `## Episodic memory` section is
  # appended at runtime.
  system_prompt: |-
    You are {name} (agent_id={agent_id}).
    Your job: help customers with order issues efficiently, accurately, and on policy.

    ## Session context
    One customer is in session. Look them up via `lookup_customer()` for their name, tier, and contact details, if needed. Do NOT ask the customer for their ID, ever. The `customer_id` parameter on every tool is auto-bound — pass an empty string `""` (or any placeholder) and the system handles the rest.

    ## Your authority
    - You can issue refunds up to ${refund_cap_usd:.2f}.
    - Refunds above your cap MUST be escalated via `escalate_to_human`. Do NOT split into smaller refunds — that's a policy violation flagged in audit.
    - You can update shipping addresses and cancel orders ONLY if the order has not yet shipped.
    - Always include a reason on writes; it's audit-logged.
    - Escalate with priority `high` if you're unsure or if the situation feels adversarial.

    ## Approach
    Investigate before acting: fetch customer and order details, check refund history, and consult policy. Act only once the issue and resolution path are clear. Skills document required procedures — consult the matching skill (per its description) before diagnosing or acting.

    ## Style
    Friendly, concise {language}. Acknowledge frustration when relevant. Cite policy by name once. Don't explain your tool calls.

# §2c — where AgentSkills auto-discovers SKILL.md files. Each subdirectory
# with a SKILL.md becomes a skill. Audience writes a new one here in §2c.
skills_dir: ./skills

# §2 — every MCP server the agent talks to. This list is the WHOLE truth:
# spawn / kill subprocesses to match this list, no special-casing in code.
# Each entry is owned by a different team in production:
#   - policy_kb           — the policy / compliance team's KB
#   - customer_support_v1 — the CS team's original backend (§2a "bad")
#   - customer_support_v2 — the CS team's redesigned backend (§2a "good")
#
# §2a hands-on: swap the `customer_support_v1` entry below for
# `customer_support_v2` (change `name` and the module in `args`). Then
# `exit` the REPL and run `python run.py` again — the v1 subprocess
# won't be started; the v2 one will.
#
# To attach another team's tools, append a new entry — no Python change:
#   - name: crm
#     command: ./services/crm-mcp-server
#     args: ["--region", "eu-west-1"]
mcp_servers:
  - name: policy_kb
    command: python
    args: ["-m", "mcp_servers.policy_kb"]
  - name: customer_support_v1
    command: python
    args: ["-m", "mcp_servers.customer_support_v1"]

# §3 demo. Three memory layers — two live, one stub.
#   conversation — within-session chat history, isolated per customer via
#                  Strands' SessionManager (sessions/session_<customer_id>/...).
#                  Persists across REPL launches. Toggle off to see the agent
#                  forget mid-conversation.
#   episodic     — past-sessions summary per customer. Loads memory/customer_<id>.md
#                  fully into the system prompt; the agent appends via `remember()`
#                  and overwrites via `compact_memory()`. §3 hands-on flips this.
#   semantic     — cross-session vector retrieval (Mem0 / Letta / Zep). Out of
#                  scope here; uncomment the line below to wire your own up.
memory:
  conversation: true
  episodic: true
  # semantic: false

# §4b / Closing — scoped identity. Refunds above this cap return a 403
# policy_violation; the agent must escalate, not retry or split.
refund_cap_usd: 200.0
